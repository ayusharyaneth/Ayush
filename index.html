    <!-- Anti-FOUC Theme Init -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'dark');
          const savedFont = localStorage.getItem('portfolio-font') || 'sans';
          const savedPalette = localStorage.getItem('portfolio-palette') || 'emerald';
          
          const html = document.documentElement;
          html.className = `theme-${savedTheme} font-${savedFont} palette-${savedPalette}`;
          html.style.colorScheme = savedTheme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
