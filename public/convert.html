<!DOCTYPE html>
<html>
<body>
<h1>Converting images...</h1>
<div id="status">Starting...</div>
<script>
async function processImage(url, name, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, size, size);
      const data = canvas.toDataURL('image/webp', 0.88);
      await fetch('http://localhost:9876', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, data })
      });
      document.getElementById('status').innerText += '\nConverted ' + name;
      resolve();
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function run() {
  try {
    await processImage('/avatars/avatar-primary.png', 'avatar-primary-128.webp', 128);
    await processImage('/avatars/avatar-primary.png', 'avatar-primary-256.webp', 256);
    await processImage('/avatars/avatar-secondary.png', 'avatar-secondary-128.webp', 128);
    await processImage('/avatars/avatar-secondary.png', 'avatar-secondary-256.webp', 256);
    document.getElementById('status').innerText += '\nDONE ALL!';
  } catch (e) {
    document.getElementById('status').innerText += '\nError: ' + e.message;
  }
}
run();
</script>
</body>
</html>
